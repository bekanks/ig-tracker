name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android loyihasini yaratish
        run: flutter create --platforms=android --project-name ig_tracker --org uz.igtracker .

      - name: Internet ruxsati va nomi
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          sed -i 's|android:label="[^"]*"|android:label="IG Tracker"|' $M

      - run: flutter pub get

      - name: APK yig'ish
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ig-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
